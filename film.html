<script type="module">

  const crt = new THREE.WebGLCubeRenderTarget(256, { type: THREE.HalfFloatType }), cc = new THREE.CubeCamera(.05, 100, crt); cc.position.set(...(spec.probeAt || [0, 1.4, -.4])); scene.add(cc);
  renderer.toneMapping = THREE.NoToneMapping; S.before?.(); const hid = []; scene.traverse(o => { if (o.userData.noProbe && o.visible) { o.visible = false; hid.push(o); } }); cc.update(renderer, scene); hid.forEach(o => o.visible = true);
  const pm = new THREE.PMREMGenerator(renderer); scene.environment = pm.fromCubemap(crt.texture).texture; scene.environmentIntensity = spec.envAmt ?? .35;

  const N = spec.time, T = {}; for (let i = 0; i < N; i++) { S.before?.(); post.render(T); }

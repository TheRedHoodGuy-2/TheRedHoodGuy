<!doctype html><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style><canvas id="c"></canvas>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<script type="module">
// propsheet.html?spec={ids:[...], w, h}: each Poly Haven model in its own cell, front view, with its size logged (internal check page)
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const spec = JSON.parse(new URLSearchParams(location.search).get('spec') || '{}'), W = spec.w || 1600, H = spec.h || 900, ids = spec.ids;
const R = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true, preserveDrawingBuffer: true }); R.setSize(W, H); R.outputColorSpace = THREE.SRGBColorSpace; R.toneMapping = THREE.NeutralToneMapping;
const cols = spec.cols || 6, rows = Math.ceil(ids.length / cols), cw = W / cols, ch = H / rows; window.info = [];
R.setScissorTest(true); R.setClearColor('#30343c');
for (const [i, id] of ids.entries()) {
  const scene = new THREE.Scene(); scene.add(new THREE.HemisphereLight('#fff', '#556', 1.2)); const d = new THREE.DirectionalLight('#fff', 2); d.position.set(2, 3, 4); scene.add(d);
  const g = await new GLTFLoader().loadAsync(`assets/ph/${id}/${id}.gltf`); scene.add(g.scene);
  const b = new THREE.Box3().setFromObject(g.scene), s = b.getSize(new THREE.Vector3()), c = b.getCenter(new THREE.Vector3());
  window.info.push([id, s.toArray().map(v => +v.toFixed(3)), b.min.toArray().map(v => +v.toFixed(3))]);
  const r = Math.max(s.x, s.y, s.z), cam = new THREE.PerspectiveCamera(30, cw / ch, .01, 100); cam.position.copy(c).add(new THREE.Vector3(r * 1.2, r * .8, r * 2.2)); cam.lookAt(c);
  const x = (i % cols) * cw, y = H - (Math.floor(i / cols) + 1) * ch; R.setViewport(x, y, cw, ch); R.setScissor(x, y, cw, ch); R.render(scene, cam);
}
console.log(JSON.stringify(window.info)); window.ready = true;
</script>

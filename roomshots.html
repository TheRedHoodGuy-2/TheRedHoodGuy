<!doctype html><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style><canvas id="c"></canvas>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<script type="module">

import * as THREE from 'three';
import { makePost } from './engine/post.js';
import { buildHouse } from './engine/sets/house.js';
import { furnishHouse } from './engine/designs/furnish.js';
import { texReady } from './engine/materials.js';
const spec = JSON.parse(new URLSearchParams(location.search).get('spec') || '{}'), W = spec.w || 960, H = spec.h || 540;
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: false, preserveDrawingBuffer: true });
renderer.setSize(W, H, false); renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const rep = await furnishHouse(scene, HS, spec.only || mine); window.report = rep;
const y0 = HS.plan.floors[fk].y;

const c = new THREE.Vector3(9, y0, 5.5), sunDir = new THREE.Vector3(.45, .8, -.7).normalize();
const sun = new THREE.DirectionalLight('#fff1dc', 2.8); sun.position.copy(c).addScaledVector(sunDir, 30); sun.target.position.copy(c); sun.castShadow = true; sun.shadow.mapSize.set(4096, 4096);
Object.assign(sun.shadow.camera, { left: -17, right: 17, top: 17, bottom: -17, near: 5, far: 70 }); sun.shadow.bias = -.0004; sun.shadow.normalBias = .03; scene.add(sun, sun.target);
scene.add(new THREE.HemisphereLight('#e4ecf8', '#8a7560', fk === 'basement' ? 1.6 : 1.1));

const post = makePost(renderer, scene, cam, W, H, { sun, volume: 0, focus: 4, aperture: .6, maxBlur: 2 * W / 540, bloom: .2, bloomRadius: .5, bloomThreshold: 1.8, bloomCap: 2.5, exposure: 1.35, contrast: 1.07, saturation: 1.1, black: .02, shadowTint: '#5a7894', highTint: '#ffe0b0', tintAmt: .18, pivot: .42 });
const crt = new THREE.WebGLCubeRenderTarget(128, { type: THREE.HalfFloatType }), cc = new THREE.CubeCamera(.05, 100, crt), pm = new THREE.PMREMGenerator(renderer); scene.add(cc);
window.shots = [];
for (const [id, r] of Object.entries(HS.rooms)) {
  if (!(spec.only || mine).includes(id)) continue;
  const R = r.refs, rect = r.rect, cx = rect.x + rect.w / 2, cz = rect.z + rect.d / 2, yb = r.y;
  let p, l;
  if (rect.type === 'attic') { p = [rect.x + 1.2, yb + 2.4, rect.z + rect.d / 2 + .6]; l = [rect.x + rect.w * .7, yb + .8, rect.z + rect.d / 2 - .4]; }
  else if (['corridor', 'hall'].includes(rect.type)) {   // corridors: from one end, down the long axis
    const alongX = R.W > R.D; p = alongX ? [cx - R.W / 2 + .9, yb + 2.2, cz] : [cx, yb + 2.2, cz + R.D / 2 - .9]; l = alongX ? [cx + R.W / 2, yb + 1.0, cz] : [cx, yb + 1.0, cz - R.D / 2]; }
  else {   // from a corner opposite the room's main piece, looking across at it; the first corner with a clear view wins
    const f = r.focus || 'n', hw = R.W / 2 - .25, hd = R.D / 2 - .25, cands = [];
    for (const ff of r.camStrict ? [f] : [f, { n: 'e', e: 's', s: 'w', w: 'n' }[f], { n: 'w', w: 's', s: 'e', e: 'n' }[f]]) for (const s2 of [1, -1]) { const C = { n: [[s2 * hw, hd], [-s2 * hw * .25, -hd * .7]], s: [[s2 * hw, -hd], [-s2 * hw * .25, hd * .7]], e: [[-hw, s2 * hd], [hw * .7, -s2 * hd * .25]], w: [[hw, s2 * hd], [-hw * .7, -s2 * hd * .25]] }[ff];
      cands.push([[cx + C[0][0], yb + 2.35, cz + C[0][1]], [cx + C[1][0], yb + 1.0, cz + C[1][1]]]); }
    const clear = ([pp, ll]) => { const L = new THREE.Vector3(...ll), Pp = new THREE.Vector3(...pp), dir = Pp.clone().sub(L), dist = dir.length(); dir.normalize();
      const h = new THREE.Raycaster(L, dir, .3, dist).intersectObject(R.root, true).filter(q => q.object.material && !q.object.material.transparent && q.object.material.colorWrite !== false); return !h.length || h[0].distance > dist - .05; };
    // free space round the camera (8 level rays): a corner jammed against a bookcase loses to one with room
    const shell = new Set([...Object.values(R.walls), R.ceiling, R.root.children[0]]), isShell = o => { for (let x = o; x; x = x.parent) if (shell.has(x)) return true; return false; };
    const room8 = pp => { let m = 2; for (let i = 0; i < 16; i++) { const d = new THREE.Vector3(Math.cos(i * Math.PI / 4), i < 8 ? -.7 : .15, Math.sin(i * Math.PI / 4)).normalize(); const h = new THREE.Raycaster(new THREE.Vector3(...pp), d, 0, 2.6).intersectObject(R.root, true).filter(q => q.object.material && !q.object.material.transparent && q.object.material.colorWrite !== false && !isShell(q.object)); if (h.length) m = Math.min(m, h[0].distance); } return m; };

  { // keep the camera out of the furniture: from the look point back to the camera, stop .35 before anything in the way
    const L = new THREE.Vector3(...l), Pp = new THREE.Vector3(...p), dir = Pp.clone().sub(L), dist = dir.length(); dir.normalize();
    const rc = new THREE.Raycaster(L, dir, .3, dist), hits = rc.intersectObject(R.root, true).filter(h => h.object.material && !h.object.material.transparent && h.object.material.colorWrite !== false);

  cam.position.set(...p); cam.lookAt(...l); cam.fov = rect.type === 'attic' ? 55 : Math.min(68, 48 + 30 / Math.max(1.5, Math.min(R.W || 4, R.D || 4))); cam.updateProjectionMatrix();
  bounce.position.set(cx, yb + 2.2, cz); cc.position.set(cx, yb + 1.5, cz); renderer.toneMapping = THREE.NoToneMapping; cc.update(renderer, scene); scene.environment = pm.fromCubemap(crt.texture).texture; scene.environmentIntensity = .35;
  renderer.shadowMap.needsUpdate = true; post.render(); post.render();
  window.shots.push([id, renderer.domElement.toDataURL('image/jpeg', .9)]);
}
window.ready = true;
</script>

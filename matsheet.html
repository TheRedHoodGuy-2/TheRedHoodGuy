<!doctype html><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style><canvas id="c"></canvas>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<script type="module">
// matsheet.html?spec={mode:'materials'|'palettes', w, h}
// materials: every library material on a 1 x 1 m tile with a rounded edge, lit by a low warm key from the side (shows bumps).
// palettes: one small room corner per palette (wall + skirting + floor + rug + a bed block) with our male + female standing in it.
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { LIB, mat, worldUV, PALETTES } from './engine/materials.js';
import { makeR6 } from './engine/r6.js';
const spec = JSON.parse(new URLSearchParams(location.search).get('spec') || '{}'), W = spec.w || 1600, H = spec.h || 900;
const R = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true, preserveDrawingBuffer: true }); R.setSize(W, H);
R.toneMapping = THREE.AgXToneMapping; R.toneMappingExposure = 1.0; R.outputColorSpace = THREE.SRGBColorSpace; R.shadowMap.enabled = true; R.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene(); scene.background = new THREE.Color('#1c1f26');
const hemi = new THREE.HemisphereLight('#cfd8e6', '#3a3028', .55); scene.add(hemi);
const key = new THREE.DirectionalLight('#ffe2c0', 3.2); key.castShadow = true; key.shadow.mapSize.set(4096, 4096); key.shadow.bias = -.0004; key.shadow.normalBias = .02; scene.add(key, key.target);
const cam = new THREE.OrthographicCamera(); const box = (w, h, d, m, x, y, z, r = .01) => { const g = worldUV(new RoundedBoxGeometry(w, h, d, 3, r)); const o = new THREE.Mesh(g, m); o.position.set(x, y, z); o.castShadow = o.receiveShadow = true; scene.add(o); return o; };
const pos = [];
if ((spec.mode || 'materials') === 'materials') {
  const names = Object.keys(LIB), cols = spec.cols || 7;
  names.forEach((n, i) => { const c = i % cols, r = Math.floor(i / cols), x = c * 1.25, y = -r * 1.42;
    const t = box(1.1, 1.1, .08, mat(n), x, y, 0, .02); t.rotation.y = -.12; pos.push([n, x, y]); });
  const rows = Math.ceil(names.length / cols), wv = cols * 1.25, hv = rows * 1.42;
  Object.assign(cam, { left: -.68, right: wv - .57, top: .66, bottom: -hv + .66 }); cam.position.set(0, 0, 10); cam.lookAt(0, 0, 0); cam.updateProjectionMatrix();
  key.position.set(-6, 3, 4); key.target.position.set(wv / 2, -hv / 2, 0); key.shadow.camera.left = -20; key.shadow.camera.right = 20; key.shadow.camera.top = 20; key.shadow.camera.bottom = -20; key.intensity = 3.6; hemi.intensity = .35;
  window.labels = pos.map(([n, x, y]) => ({ name: n, note: LIB[n].note, x: (x + .68) / (wv + .11), y: (.66 - y + .62) / (hv) }));
} else {
  const names = Object.keys(PALETTES); const persp = new THREE.PerspectiveCamera(30, W / H / names.length, .1, 100);
  for (const [i, n] of names.entries()) {
    const P = PALETTES[n], ox = i * 20;
    box(5, 3, .15, mat('plaster', { color: P.wall }), ox, 1.5, -2, .01); box(.15, 3, 5, mat('plaster', { color: P.wall }), ox - 2.5, 1.5, .5, .01);
    box(5, .12, .04, mat('wood_fine', { color: P.trim }), ox, .06, -1.9, .01);
    box(5.2, .1, 5.2, mat(P.floor), ox, -.05, .5, .01);
    box(1.9, .02, 1.3, mat('fabric_pattern', { color: P.accent }), ox + .4, .01, .9, .005);
    box(1.4, .45, 2.1, mat('knit', { color: P.soft }), ox - 1.6, .32, -.85, .08); box(1.45, .9, .1, mat('wood_fine'), ox - 1.6, .45, -1.92, .02);
    const lamp = new THREE.PointLight('#ffd7a0', 0, 6); scene.add(lamp);
    for (const [k, cs] of [[0, { face: false, yaw: 20, accessories: [95679574702276, 17803581539], hair: [106737517544920] }], [1, { face: false, sex: 'f', yaw: -25, accessories: [122234930607561, 77644432473750], hair: [6536255505] }]]) {
      const a = await makeR6({ res: 256, ...cs }); a.root.position.set(ox + (k ? 1.0 : -.6), 0, 1.1 + (k ? .3 : 0)); a.root.rotation.y = THREE.MathUtils.degToRad(cs.yaw); scene.add(a.root); }
  }
  key.position.set(4, 6, 6); key.intensity = 2.6; hemi.intensity = .7; key.shadow.camera.left = -60; key.shadow.camera.right = 80; key.shadow.camera.top = 30; key.shadow.camera.bottom = -30; key.target.position.set(30, 0, 0); key.position.set(34, 6, 6);
  await new Promise(r => setTimeout(r, 2500));
  R.setScissorTest(true); const cw = W / names.length;
  names.forEach((n, i) => { persp.position.set(i * 20 + 3.4, 2.6, 9.5); persp.lookAt(i * 20 - .2, 1.05, 0); R.setViewport(i * cw, 0, cw, H); R.setScissor(i * cw, 0, cw, H); R.render(scene, persp); });
  window.labels = names.map((n, i) => ({ name: n, note: PALETTES[n].note, x: i / names.length + .01, y: .02 }));
  window.ready = true; throw new Error('done');
}
await new Promise(r => setTimeout(r, 2500));
R.render(scene, cam); window.ready = true;
</script>
